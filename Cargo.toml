[package]
name = "kubectl-mx"
version = "0.1.0"
authors = ["Jonas-Taha El Sesiy"]
edition = "2021"

[dependencies]
anyhow = "1.0.100"
clap = { version = "4.5", features = ["derive", "env"] }
colored = "3.0"
dialoguer = "0.12"
indicatif = "0.18"
log = "0.4.28"
regex = "1.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.9"
tokio = { version = "1.47", features = ["full"] }

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3"
