[package]
name = "kubectl-mx"
version = "0.1.0"
authors = ["Jonas-Taha El Sesiy"]
edition = "2021"

[dependencies]
clap = { version = "4.6", features = ["derive", "env"] }
colored = "3.1"
dialoguer = "0.12"
indicatif = "0.18"
regex = "1.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.9"
tokio = { version = "1.52", features = ["macros", "process", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
assert_cmd = "2.2"
predicates = "3"
